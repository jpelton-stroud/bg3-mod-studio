[project]
name = "bg3-theorycraft"
version = "1.0.0b1"
description = "Baldur's Gate 3 Mod Studio Theorycrafting and Build Guide Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bg3-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bg3_theorycraft"]
