[project]
name = "bg3-core"
version = "1.0.0"
description = "Baldur's Gate 3 Mod Studio Core Runtime, Parsers, and API Client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bg3 = "bg3_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bg3_core"]
