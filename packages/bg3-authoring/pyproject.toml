[project]
name = "bg3-authoring"
version = "1.0.0b1"
description = "Baldur's Gate 3 Mod Studio Authoring, Diagnostics, and Packaging Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bg3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bg3_authoring"]
