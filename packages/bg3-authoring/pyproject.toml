[project]
name = "bg3-authoring"
version = "1.0.0"
description = "Baldur's Gate 3 Mod Studio Authoring, Diagnostics, and Packaging Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bg3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bg3_authoring"]

[project.entry-points."bg3.commands"]
"mod.create" = "bg3_authoring.create_mod_scaffold:main"
"mod.scaffold" = "bg3_authoring.scaffold_asset:main"
"mod.validate" = "bg3_authoring.diagnostics.validate_mod:main"
"mod.add-dependency" = "bg3_authoring.add_mod_dependency:main"
"mod.bump-version" = "bg3_authoring.bump_mod_version:main"
"mod.pack" = "bg3_authoring.packaging.pack_mod_pak:main"
"mod.sync-loca" = "bg3_authoring.diagnostics.sync_localization:main"
"mod.sync-game" = "bg3_authoring.packaging.sync_game_data:main"
"mod.patch" = "bg3_authoring.generate_compat_patch:main"
"mod.diagnose-logs" = "bg3_authoring.diagnostics.diagnose_toolkit_logs:main"
"mod.inject-treasure" = "bg3_authoring.inject_treasure_table:main"

