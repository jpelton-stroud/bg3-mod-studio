[project]
name = "bg3-mod-studio"
version = "1.0.0b1"
description = "Baldur's Gate 3 Mod Studio & Mod.io Automation Metapackage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bg3-core",
    "bg3-theorycraft",
    "bg3-authoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bg3_mod_studio"]
